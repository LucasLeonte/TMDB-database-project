services:
    postgres:
        image: postgres:16
        container_name: tmdb_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-tmdb}
            POSTGRES_USER: ${POSTGRES_USER:-tmdb_admin}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tmdb_secret}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
    postgres_data:
